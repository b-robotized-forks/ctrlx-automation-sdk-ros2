# Builds the ROS 2 Jazzy base snap (ros2-base-jazzy-deb) for amd64 and publishes
# it as a GitHub Release asset for tags matching 'v*'.
#
# arm64 is intentionally not built here: it needs a native arm64 host and is not
# part of the released set yet, see ros2-base-jazzy-deb/README.md.
#
# All build logic lives in the project scripts under scripts/ and
# ros2-base-jazzy-deb/ - this workflow only provisions the runner and calls them.

name: Build ROS 2 base snap

on:
  push:
    branches: [ b-controlled-box/jazzy ]
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'ros2-base-jazzy-deb/**'
      - 'scripts/**'
      - '.github/workflows/build-snap-ros2-base.yml'
  workflow_dispatch:
    inputs:
      overlay_ref:
        description: 'Git ref of the overlay repository (ros-controls/foreman)'
        required: false
        default: 'master'

env:
  # Pin the overlay so a release is reproducible. Bump deliberately.
  OVERLAY_REF: ${{ inputs.overlay_ref || 'master' }}
  # ctrlX AUTOMATION SDK release providing the ctrlx-datalayer / ctrlx-scheduler debs.
  CTRLX_SDK_VERSION: '4.6.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build amd64 snap
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell || true
          df -h /

      # Installs ROS 2 Jazzy + ros-dev-tools. Needed to build the overlay
      # packages with colcon; snapcraft itself builds in host mode.
      - name: Set up ROS 2 Jazzy
        run: ./scripts/setup-system-jazzy-noble.sh

      - name: Initialise rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      # Also writes SNAPCRAFT_BUILD_ENVIRONMENT=host to /etc/environment, which
      # sudo picks up via pam_env. build-snap-amd64.sh relies on that for its
      # 'snapcraft clean' call, so this step has to run before the build.
      - name: Install snapcraft
        run: ./scripts/install-snapcraft.sh

      # Registers the ctrlx-datalayer / ctrlx-scheduler debs as a local apt
      # source. Required by the 'datalayer' part of snap/snapcraft.yaml, which
      # resolves stage-packages against the host's apt sources in host mode.
      - name: Set up ctrlX Data Layer debs
        run: ./scripts/setup-ctrlx-datalayer-deb.sh "${CTRLX_SDK_VERSION}"

      # The setup script does not run under 'set -e', so verify the local apt
      # source really provides the package the 'datalayer' part stages.
      - name: Verify ctrlx-datalayer is available
        run: |
          apt-cache policy ctrlx-datalayer
          test -n "$(apt-cache policy ctrlx-datalayer | awk '/Candidate:/ && $2 != "(none)"')"

      # Not covered by scripts/: the 'b-robotized-overlay-packages' part is
      # sourced from a generated directory that is not committed.
      - name: Build overlay packages
        working-directory: ros2-base-jazzy-deb
        run: ./build-overlay-packages.sh

      - name: Build snap
        working-directory: ros2-base-jazzy-deb
        run: ./build-snap-amd64.sh

      - name: Locate snap
        id: snap
        working-directory: ros2-base-jazzy-deb
        run: |
          snap_file=$(ls -1 ./*.snap | head -n1)
          test -s "${snap_file}"
          echo "path=ros2-base-jazzy-deb/${snap_file#./}" >> "$GITHUB_OUTPUT"
          ls -lh "${snap_file}"

      # Short retention: these exist for debugging branch/PR builds and to hand
      # the snap over to the release job. Releases are the permanent store.
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-amd64
          path: ${{ steps.snap.outputs.path }}
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download snap
        uses: actions/download-artifact@v4
        with:
          name: snap-amd64
          path: dist

      - name: List assets
        run: ls -lh dist/

      # snap/snapcraft.yaml stays the source of truth for the snap version, so
      # the tag and the asset version may legitimately differ. Warn, never fail.
      - name: Check tag against snap version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in dist/*.snap; do
            ver=$(basename "$f" | sed -E 's/^.*_([^_]+)_[^_]+\.snap$/\1/')
            if [ "$ver" != "$tag" ]; then
              echo "::warning::Tag ${GITHUB_REF_NAME} does not match snap version ${ver} ($(basename "$f"))"
            fi
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.snap \
            --repo "${GITHUB_REPOSITORY}" --clobber
